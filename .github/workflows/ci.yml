name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - name: Lint shell scripts (shellcheck)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck scripts/*.sh
      - name: Release script tests (dry run, local fake origin)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          scripts/test-release.sh
          scripts/release.sh dev --dry-run
          scripts/release.sh prod --dry-run
      - run: npm run typecheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jcmx9/real-fast-document
          path: .rfd
          sparse-checkout: /header.md
          sparse-checkout-cone-mode: false

      - run: npm run test:coverage
        env:
          RFD_HEADER: ${{ github.workspace }}/.rfd/header.md
      - run: npm run build

      - name: Install rf-document (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/jcmx9/real-fast-document/main/scripts/bootstrap.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install rf-document (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          irm https://raw.githubusercontent.com/jcmx9/real-fast-document/main/scripts/bootstrap.ps1 | iex
          # winget puts typst on the *user* PATH for new sessions only; a fresh
          # login would see it, so hand those entries to the following steps.
          [Environment]::GetEnvironmentVariable("Path", "User") -split ';' |
            Where-Object { $_ } |
            ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ -Encoding ascii }

      - name: Prepare Electron on Linux
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64

      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test
        env:
          RFW_E2E_REAL_RFD: '1'
          RFD_NO_OPEN: '1'

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npx playwright test
        env:
          RFW_E2E_REAL_RFD: '1'
          RFD_NO_OPEN: '1'

      - name: Package (electron-builder)
        run: npm run dist
        env:
          # Ad-hoc signing needs no secrets; electron-builder skips all signing on PRs otherwise.
          CSC_FOR_PULL_REQUEST: 'true'

      - name: Smoke-test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          arch="$(uname -m)"; [ "${arch}" = "x86_64" ] && arch="x64"
          zip="dist/rf-write-${version}-mac-${arch}.zip"
          dest="${RUNNER_TEMP}/rf-write-smoke"
          rm -rf "${dest}" && mkdir -p "${dest}"
          ditto -x -k "${zip}" "${dest}"
          app="${dest}/rf-write.app"
          codesign --verify --deep --strict "${app}"
          codesign -dv "${app}" 2>&1 | grep -q '^Signature=adhoc$'
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "${app}/Contents/Info.plist")" = "rf-write" ]
          out="$("${app}/Contents/MacOS/rf-write" --version)"
          echo "${out}"
          [ "${out}" = "rf-write ${version}" ]

      - name: Smoke-test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          image="dist/rf-write-${version}-linux-x86_64.AppImage"
          chmod +x "${image}"
          # No FUSE on the runner: the AppImage runtime extracts to a temp dir and runs from there.
          out="$(APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "${image}" --version)"
          echo "${out}"
          [ "${out}" = "rf-write ${version}" ]

      - name: Smoke-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $zip = "dist/rf-write-$version-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          $out = (& .\dist\win-unpacked\rf-write.exe --version | Out-String).Trim()
          Write-Output $out
          if ($out -ne "rf-write $version") { throw "unexpected --version output: '$out'" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # Installs the freshly packaged app with scripts/bootstrap.{sh,ps1} (RFW_ARCHIVE) into an
  # isolated temp profile, checks the installed command, update, refusal of unmarked folders
  # and uninstall. The download path is covered on macOS/Linux with a fake GitHub.
  bootstrap:
    name: bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Package (electron-builder)
        run: npm run dist
        env:
          CSC_FOR_PULL_REQUEST: 'true'

      - name: Bootstrap install / update / uninstall (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/test-bootstrap.sh

      - name: Prepare Electron on Linux
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64

      - name: Bootstrap install / update / uninstall (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/test-bootstrap.sh
        env:
          # No FUSE on the runner: the AppImage runtime extracts to a temp dir and runs from there.
          APPIMAGE_EXTRACT_AND_RUN: '1'

      - name: Bootstrap install / update / uninstall (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-bootstrap.ps1
